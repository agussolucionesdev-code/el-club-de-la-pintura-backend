name: CI

# Gate every push and pull request: nothing merges or deploys if typecheck,
# Prisma generation, or the integration test suite fails.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the integration tests. The setup guard points the
    # suite at TEST_DATABASE_URL, never at the production Neon database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: el_club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/el_club_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/el_club_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (build)
        run: npm run typecheck

      # El tsconfig principal excluye `tests/`, así que hasta ahora el typecheck
      # nunca miró la suite: un error de tipos en un test recién aparecía al
      # correr Jest, es decir, sólo con una base disponible.
      - name: Typecheck (tests)
        run: npm run typecheck:tests

      # `migrate deploy`, no `db push`. `db push` sincroniza el esquema saltándose
      # los archivos de migración, así que una migración rota pasaba el CI en
      # verde y recién explotaba al desplegar. Este paso corre exactamente lo
      # mismo que produccion.
      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      # Contraste de deriva: si el esquema que dejan las migraciones no coincide
      # con schema.prisma, `migrate diff` devuelve exit code 2 y el CI falla.
      #
      # Este chequeo no es teórico: al levantar la base de tests apareció que la
      # tabla `Return` entera y `Branch.isActive` existían en producción (creadas
      # con `db push`) pero NO en ninguna migración. Una base creada desde cero
      # quedaba con el módulo de devoluciones roto. Lo cerró la migración
      # 20260811220000_reconcile_return_table_and_branch_isactive.
      #
      # `--from-url` fue removido en Prisma 7: se usa `--from-config-datasource`,
      # que toma la URL de prisma.config.ts (o sea, DATABASE_URL).
      - name: Verify migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Run integration tests
        run: npm test
